<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Quest Landscape</title>
    <meta name="description" content="Landscape demo with a controllable character for phone and Meta Quest.">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.4.0/dist/aframe-extras.loaders.min.js"></script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
        touch-action: none;
      }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
      #instructions {
        position: absolute; top: env(safe-area-inset-top, 0); left: 50%; transform: translateX(-50%);
        margin-top: 12px; padding: 10px 14px; border-radius: 14px;
        background: rgba(0,0,0,.45); color: #fff; font-size: 14px; text-align: center;
        max-width: min(92vw, 440px); backdrop-filter: blur(8px);
      }
      #joystick-zone {
        position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px));
        width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.08);
        border: 2px solid rgba(255,255,255,.14); pointer-events: auto; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; touch-action: none;
      }
      #joystick-knob {
        position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin-left: -31px; margin-top: -31px;
        border-radius: 50%; background: rgba(255,255,255,.30); border: 2px solid rgba(255,255,255,.24);
        box-shadow: 0 6px 24px rgba(0,0,0,.25);
      }
      #look-zone { position: absolute; right: 0; top: 0; width: 50vw; height: 100vh; pointer-events: auto; touch-action: none; }
      .hidden { display: none !important; }
      @media (pointer: fine) { #look-zone { display: none; } }
    </style>
    <script>
      window.questLandscapeInput = { moveX: 0, moveY: 0, source: 'idle', touching: false };
      const WORLD_BOUNDS = { minX: -22, maxX: 22, minZ: -22, maxZ: 22, groundY: 0 };
      const COLLIDERS = [
        { x: 0, z: -8, r: 1.9 },
        { x: 6, z: -10, r: 1.7 },
        { x: -7, z: -4, r: 2.2 },
        { x: 10, z: 6, r: 2.4 },
        { x: -12, z: 10, r: 2.6 }
      ];

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function resolveMovement(nextX, nextZ, radius = 0.9) {
        let x = clamp(nextX, WORLD_BOUNDS.minX, WORLD_BOUNDS.maxX);
        let z = clamp(nextZ, WORLD_BOUNDS.minZ, WORLD_BOUNDS.maxZ);

        for (const collider of COLLIDERS) {
          const dx = x - collider.x;
          const dz = z - collider.z;
          const distance = Math.hypot(dx, dz);
          const minDistance = collider.r + radius;
          if (distance < minDistance) {
            if (distance < 0.0001) {
              x = collider.x + minDistance;
            } else {
              const push = minDistance / distance;
              x = collider.x + dx * push;
              z = collider.z + dz * push;
            }
          }
        }

        return { x, z, y: WORLD_BOUNDS.groundY };
      }

      document.addEventListener('DOMContentLoaded', () => {
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        const lookZone = document.getElementById('look-zone');
        const scene = document.querySelector('a-scene');
        const player = document.getElementById('player');
        const camera = document.getElementById('player-camera');
        const cameraMount = document.getElementById('camera-mount');
        const instructions = document.getElementById('instructions');
        const characterVisual = document.getElementById('character-visual');
        const radius = 48;
        let joystickPointerId = null;
        let lookPointerId = null;
        let lookActive = false;
        let lastLookX = 0;
        let lastLookY = 0;
        let pitch = 0;
        let isVR = false;
        let lastFrameTime = performance.now();

        window.questLandscapeKeys = { left: false, right: false, up: false, down: false };

        window.addEventListener('keydown', (event) => {
          if (event.code === 'KeyA' || event.code === 'ArrowLeft') window.questLandscapeKeys.left = true;
          if (event.code === 'KeyD' || event.code === 'ArrowRight') window.questLandscapeKeys.right = true;
          if (event.code === 'KeyW' || event.code === 'ArrowUp') window.questLandscapeKeys.up = true;
          if (event.code === 'KeyS' || event.code === 'ArrowDown') window.questLandscapeKeys.down = true;
        });
        window.addEventListener('keyup', (event) => {
          if (event.code === 'KeyA' || event.code === 'ArrowLeft') window.questLandscapeKeys.left = false;
          if (event.code === 'KeyD' || event.code === 'ArrowRight') window.questLandscapeKeys.right = false;
          if (event.code === 'KeyW' || event.code === 'ArrowUp') window.questLandscapeKeys.up = false;
          if (event.code === 'KeyS' || event.code === 'ArrowDown') window.questLandscapeKeys.down = false;
        });

        function setJoystick(x, y, source = 'unknown') {
          knob.style.transform = `translate(${x}px, ${y}px)`;
          window.questLandscapeInput.moveX = x / radius;
          window.questLandscapeInput.moveY = -y / radius;
          window.questLandscapeInput.source = source;
        }
        function resetJoystick() {
          knob.style.transform = 'translate(0px, 0px)';
          window.questLandscapeInput.moveX = 0;
          window.questLandscapeInput.moveY = 0;
          window.questLandscapeInput.touching = false;
          window.questLandscapeInput.source = 'idle';
        }
        function updateJoystick(clientX, clientY) {
          const rect = zone.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          let dx = clientX - centerX;
          let dy = clientY - centerY;
          const length = Math.hypot(dx, dy);
          if (length > radius) {
            dx = (dx / length) * radius;
            dy = (dy / length) * radius;
          }
          setJoystick(dx, dy, 'calc');
        }
        function applyLookDelta(dx, dy) {
          const playerObj = player.object3D;
          playerObj.rotation.y -= dx * 0.01;
          pitch = Math.max(-0.9, Math.min(0.55, pitch - dy * 0.01));
          camera.object3D.rotation.x = pitch;
        }

        zone.addEventListener('pointerdown', (event) => {
          joystickPointerId = event.pointerId;
          if (zone.setPointerCapture) zone.setPointerCapture(event.pointerId);
          window.questLandscapeInput.touching = true;
          updateJoystick(event.clientX, event.clientY);
          instructions.textContent = 'Left thumb: move · Right side: look';
        });
        zone.addEventListener('pointermove', (event) => {
          if (event.pointerId !== joystickPointerId) return;
          updateJoystick(event.clientX, event.clientY);
        });
        function releaseJoystick(event) {
          if (event && event.pointerId !== undefined && event.pointerId !== joystickPointerId) return;
          joystickPointerId = null;
          resetJoystick();
        }
        zone.addEventListener('pointerup', releaseJoystick);
        zone.addEventListener('pointercancel', releaseJoystick);
        zone.addEventListener('touchstart', (event) => {
          const touch = event.changedTouches[0]; if (!touch) return;
          event.preventDefault(); window.questLandscapeInput.touching = true; window.questLandscapeInput.source = 'touch';
          updateJoystick(touch.clientX, touch.clientY); instructions.textContent = 'Left thumb: move · Right side: look';
        }, { passive: false });
        zone.addEventListener('touchmove', (event) => {
          const touch = event.changedTouches[0]; if (!touch) return;
          event.preventDefault(); window.questLandscapeInput.touching = true; window.questLandscapeInput.source = 'touch';
          updateJoystick(touch.clientX, touch.clientY);
        }, { passive: false });
        zone.addEventListener('touchend', (event) => { event.preventDefault(); releaseJoystick(); }, { passive: false });
        zone.addEventListener('touchcancel', (event) => { event.preventDefault(); releaseJoystick(); }, { passive: false });

        lookZone.addEventListener('pointerdown', (event) => {
          if (scene.is('vr-mode')) return;
          lookPointerId = event.pointerId;
          if (lookZone.setPointerCapture) lookZone.setPointerCapture(event.pointerId);
          lookActive = true; lastLookX = event.clientX; lastLookY = event.clientY;
        });
        lookZone.addEventListener('pointermove', (event) => {
          if (!lookActive || event.pointerId !== lookPointerId || scene.is('vr-mode')) return;
          const dx = event.clientX - lastLookX; const dy = event.clientY - lastLookY;
          lastLookX = event.clientX; lastLookY = event.clientY; applyLookDelta(dx, dy);
        });
        function releaseLook(event) {
          if (event && event.pointerId !== undefined && event.pointerId !== lookPointerId) return;
          lookActive = false; lookPointerId = null;
        }
        lookZone.addEventListener('pointerup', releaseLook);
        lookZone.addEventListener('pointercancel', releaseLook);
        lookZone.addEventListener('touchstart', (event) => {
          if (scene.is('vr-mode')) return;
          const touch = event.changedTouches[0]; if (!touch) return;
          event.preventDefault(); lookActive = true; lastLookX = touch.clientX; lastLookY = touch.clientY;
        }, { passive: false });
        lookZone.addEventListener('touchmove', (event) => {
          if (!lookActive || scene.is('vr-mode')) return;
          const touch = event.changedTouches[0]; if (!touch) return;
          event.preventDefault(); const dx = touch.clientX - lastLookX; const dy = touch.clientY - lastLookY;
          lastLookX = touch.clientX; lastLookY = touch.clientY; applyLookDelta(dx, dy);
        }, { passive: false });
        lookZone.addEventListener('touchend', (event) => { event.preventDefault(); releaseLook(); }, { passive: false });
        lookZone.addEventListener('touchcancel', (event) => { event.preventDefault(); releaseLook(); }, { passive: false });

        function updateMovement(now) {
          const delta = Math.min((now - lastFrameTime) / 1000, 0.05);
          lastFrameTime = now;
          const inputX = window.questLandscapeInput.moveX || 0;
          const inputY = window.questLandscapeInput.moveY || 0;
          let keyX = 0, keyY = 0;
          if (window.questLandscapeKeys.left) keyX -= 1;
          if (window.questLandscapeKeys.right) keyX += 1;
          if (window.questLandscapeKeys.up) keyY += 1;
          if (window.questLandscapeKeys.down) keyY -= 1;
          let x = inputX + keyX;
          let y = inputY + keyY;
          const length = Math.hypot(x, y);
          if (length > 1) { x /= length; y /= length; }

          const playerObj = player.object3D;
          playerObj.position.y = WORLD_BOUNDS.groundY;

          if (length > 0.02) {
            const cameraYaw = camera.object3D.rotation.y;
            const worldYaw = playerObj.rotation.y + cameraYaw;
            const forwardX = -Math.sin(worldYaw), forwardZ = -Math.cos(worldYaw);
            const rightX = Math.cos(worldYaw), rightZ = -Math.sin(worldYaw);
            const moveX = rightX * x + forwardX * y;
            const moveZ = rightZ * x + forwardZ * y;
            const moveLen = Math.hypot(moveX, moveZ) || 1;
            const nx = moveX / moveLen, nz = moveZ / moveLen;
            const speed = 3.6;
            const resolved = resolveMovement(playerObj.position.x + nx * speed * delta, playerObj.position.z + nz * speed * delta);
            playerObj.position.set(resolved.x, resolved.y, resolved.z);
            player.setAttribute('position', resolved);

            if (!isVR) {
              const targetYaw = Math.atan2(nx, nz);
              const currentYaw = characterVisual.object3D.rotation.y;
              const wrapped = Math.atan2(Math.sin(targetYaw - currentYaw), Math.cos(targetYaw - currentYaw));
              characterVisual.object3D.rotation.y = currentYaw + wrapped * Math.min(1, 10 * delta);
            }
          } else {
            const grounded = resolveMovement(playerObj.position.x, playerObj.position.z);
            playerObj.position.set(grounded.x, grounded.y, grounded.z);
            player.setAttribute('position', grounded);
          }
          requestAnimationFrame(updateMovement);
        }

        requestAnimationFrame(updateMovement);

        scene.addEventListener('enter-vr', () => {
          isVR = true;
          document.getElementById('hud').classList.add('hidden');
          cameraMount.setAttribute('position', '0 1.6 0');
          characterVisual.setAttribute('visible', false);
        });
        scene.addEventListener('exit-vr', () => {
          isVR = false;
          document.getElementById('hud').classList.remove('hidden');
          cameraMount.setAttribute('position', '0 1.45 3.8');
          characterVisual.setAttribute('visible', true);
          camera.object3D.rotation.x = 0;
          pitch = 0;
          instructions.textContent = 'Left thumb: move · Right side: look · Stay inside the grove';
        });
      });
    </script>
  </head>
  <body>
    <div id="hud">
      <div id="instructions">Left thumb: move · Right side: look · Tap the VR button for Quest</div>
      <div id="joystick-zone" aria-label="Movement joystick"><div id="joystick-knob"></div></div>
      <div id="look-zone" aria-hidden="true"></div>
    </div>

    <a-scene shadow="type: pcfsoft" renderer="colorManagement: true; physicallyCorrectLights: true">
      <a-assets>
        <a-asset-item id="hero-model" src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/RobotExpressive/RobotExpressive.glb"></a-asset-item>
      </a-assets>

      <a-entity environment="preset: forest; dressingAmount: 140; dressingScale: 1.2; skyType: atmosphere; lighting: distant; groundColor: #355e3b; groundColor2: #27492d"></a-entity>
      <a-light type="hemisphere" intensity="0.65" color="#ffffff" groundColor="#6b8b5a"></a-light>
      <a-light type="directional" intensity="0.9" position="-3 8 2" cast-shadow="true"></a-light>
      <a-plane rotation="-90 0 0" width="160" height="160" color="#365b37" material="shader: flat; opacity: 0" shadow="receive: true"></a-plane>

      <a-entity position="0 0 -8">
        <a-cylinder position="0 1.6 0" radius="0.28" height="3.2" color="#6d4c41" shadow="cast: true"></a-cylinder>
        <a-sphere position="0 3.7 0" radius="1.55" color="#2e7d32" shadow="cast: true; receive: true"></a-sphere>
        <a-sphere position="-0.8 3.1 0.45" radius="1.05" color="#388e3c" shadow="cast: true; receive: true"></a-sphere>
        <a-sphere position="0.75 3.15 -0.3" radius="1.1" color="#43a047" shadow="cast: true; receive: true"></a-sphere>
        <a-sphere position="0 4.35 0" radius="1.15" color="#2e7d32" shadow="cast: true; receive: true"></a-sphere>
      </a-entity>
      <a-entity position="6 0 -10">
        <a-cylinder position="0 1.5 0" radius="0.25" height="3" color="#5d4037" shadow="cast: true"></a-cylinder>
        <a-sphere position="0 3.45 0" radius="1.25" color="#1b5e20" shadow="cast: true"></a-sphere>
        <a-sphere position="0 4.2 0" radius="0.95" color="#2e7d32" shadow="cast: true"></a-sphere>
      </a-entity>
      <a-entity position="-7 0 -4">
        <a-cylinder position="0 1.9 0" radius="0.32" height="3.6" color="#6d4c41" shadow="cast: true"></a-cylinder>
        <a-sphere position="0 4.2 0" radius="1.8" color="#2f7d43" shadow="cast: true"></a-sphere>
      </a-entity>
      <a-entity position="10 0 6">
        <a-sphere position="0 0.9 0" radius="1.5" color="#727c79" shadow="cast: true"></a-sphere>
        <a-sphere position="1.1 0.6 0.3" radius="0.9" color="#68716e" shadow="cast: true"></a-sphere>
      </a-entity>
      <a-entity position="-12 0 10">
        <a-sphere position="0 1.0 0" radius="1.8" color="#78827f" shadow="cast: true"></a-sphere>
      </a-entity>

      <a-entity id="boundary-ring">
        <a-box position="0 1 -23.5" depth="1" width="50" height="2" color="#4b6a4a" opacity="0.65"></a-box>
        <a-box position="0 1 23.5" depth="1" width="50" height="2" color="#4b6a4a" opacity="0.65"></a-box>
        <a-box position="23.5 1 0" depth="50" width="1" height="2" color="#4b6a4a" opacity="0.65"></a-box>
        <a-box position="-23.5 1 0" depth="50" width="1" height="2" color="#4b6a4a" opacity="0.65"></a-box>
      </a-entity>

      <a-entity id="player" position="0 0 5">
        <a-entity id="character-visual" position="0 0 0" rotation="0 180 0">
          <a-entity gltf-model="#hero-model" position="0 0 0" scale="0.35 0.35 0.35" shadow="cast: true"></a-entity>
        </a-entity>
        <a-entity id="camera-mount" position="0 1.45 3.8">
          <a-camera id="player-camera" position="0 0 0" look-controls="pointerLockEnabled: false; touchEnabled: false; mouseEnabled: true; magicWindowTrackingEnabled: false" wasd-controls-enabled="false">
            <a-cursor color="white" fuse="false"></a-cursor>
          </a-camera>
        </a-entity>
        <a-entity oculus-touch-controls="hand: left" laser-controls="hand: left"></a-entity>
        <a-entity oculus-touch-controls="hand: right" laser-controls="hand: right"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
