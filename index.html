<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Quest Landscape</title>
    <meta name="description" content="Landscape demo with a controllable character for phone and Meta Quest.">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
        touch-action: none;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
      }

      #instructions {
        position: absolute;
        top: env(safe-area-inset-top, 0);
        left: 50%;
        transform: translateX(-50%);
        margin-top: 12px;
        padding: 10px 14px;
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 14px;
        text-align: center;
        max-width: min(92vw, 440px);
        backdrop-filter: blur(8px);
      }

      #joystick-zone {
        position: absolute;
        left: max(18px, env(safe-area-inset-left, 0px));
        bottom: max(18px, env(safe-area-inset-bottom, 0px));
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.14);
        pointer-events: auto;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      #joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 62px;
        height: 62px;
        margin-left: -31px;
        margin-top: -31px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        border: 2px solid rgba(255, 255, 255, 0.24);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      }

      #look-zone {
        position: absolute;
        right: 0;
        top: 0;
        width: 50vw;
        height: 100vh;
        pointer-events: auto;
        touch-action: none;
      }

      .hidden {
        display: none !important;
      }

      @media (pointer: fine) {
        #look-zone {
          display: none;
        }
      }
    </style>
    <script>
      AFRAME.registerComponent('player-controller', {
        schema: {
          speed: { default: 3.6 },
          turnSmoothing: { default: 10 }
        },

        init: function () {
          this.moveInput = { x: 0, y: 0 };
          this.keys = {};
          this.isVR = false;
          this.cameraMount = document.getElementById('camera-mount');
          this.characterVisual = document.getElementById('character-visual');
          this.sceneEl.addEventListener('enter-vr', () => {
            this.isVR = true;
            this.cameraMount.setAttribute('position', '0 1.6 0');
            this.characterVisual.setAttribute('visible', false);
          });
          this.sceneEl.addEventListener('exit-vr', () => {
            this.isVR = false;
            this.cameraMount.setAttribute('position', '0 1.45 3.8');
            this.characterVisual.setAttribute('visible', true);
          });

          window.addEventListener('keydown', (event) => {
            this.keys[event.code] = true;
          });
          window.addEventListener('keyup', (event) => {
            this.keys[event.code] = false;
          });
        },

        setMoveInput: function (x, y) {
          this.moveInput.x = x;
          this.moveInput.y = y;
        },

        getCombinedInput: function () {
          let x = this.moveInput.x;
          let y = this.moveInput.y;

          if (this.keys['KeyA'] || this.keys['ArrowLeft']) x -= 1;
          if (this.keys['KeyD'] || this.keys['ArrowRight']) x += 1;
          if (this.keys['KeyW'] || this.keys['ArrowUp']) y += 1;
          if (this.keys['KeyS'] || this.keys['ArrowDown']) y -= 1;

          const length = Math.hypot(x, y);
          if (length > 1) {
            x /= length;
            y /= length;
          }

          return { x, y, active: length > 0.01 };
        },

        tick: function (_time, deltaMs) {
          const delta = Math.min(deltaMs / 1000, 0.05);
          const input = this.getCombinedInput();
          if (!input.active) return;

          const camera = document.getElementById('player-camera');
          const yaw = camera.object3D.rotation.y;
          const forwardX = -Math.sin(yaw);
          const forwardZ = -Math.cos(yaw);
          const rightX = Math.cos(yaw);
          const rightZ = -Math.sin(yaw);

          const moveX = rightX * input.x + forwardX * input.y;
          const moveZ = rightZ * input.x + forwardZ * input.y;
          const moveLength = Math.hypot(moveX, moveZ) || 1;
          const nx = moveX / moveLength;
          const nz = moveZ / moveLength;

          this.el.object3D.position.x += nx * this.data.speed * delta;
          this.el.object3D.position.z += nz * this.data.speed * delta;

          if (!this.isVR) {
            const targetYaw = Math.atan2(nx, nz);
            const currentYaw = this.characterVisual.object3D.rotation.y;
            const wrapped = Math.atan2(Math.sin(targetYaw - currentYaw), Math.cos(targetYaw - currentYaw));
            this.characterVisual.object3D.rotation.y = currentYaw + wrapped * Math.min(1, this.data.turnSmoothing * delta);
          }
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        const lookZone = document.getElementById('look-zone');
        const scene = document.querySelector('a-scene');
        const player = document.getElementById('player');
        const camera = document.getElementById('player-camera');
        const instructions = document.getElementById('instructions');
        const controller = () => player.components['player-controller'];

        const radius = 48;
        let joystickPointerId = null;
        let lookPointerId = null;
        let lookActive = false;
        let lastLookX = 0;
        let lastLookY = 0;
        let pitch = 0;

        function setJoystick(x, y) {
          knob.style.transform = `translate(${x}px, ${y}px)`;
          if (controller()) controller().setMoveInput(x / radius, -y / radius);
        }

        function resetJoystick() {
          knob.style.transform = 'translate(0px, 0px)';
          if (controller()) controller().setMoveInput(0, 0);
        }

        function updateJoystickFromEvent(event) {
          const rect = zone.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          let dx = event.clientX - centerX;
          let dy = event.clientY - centerY;
          const length = Math.hypot(dx, dy);
          if (length > radius) {
            dx = (dx / length) * radius;
            dy = (dy / length) * radius;
          }
          setJoystick(dx, dy);
        }

        zone.addEventListener('pointerdown', (event) => {
          joystickPointerId = event.pointerId;
          zone.setPointerCapture(event.pointerId);
          updateJoystickFromEvent(event);
          instructions.textContent = 'Left thumb: move · Right side: look';
        });

        zone.addEventListener('pointermove', (event) => {
          if (event.pointerId !== joystickPointerId) return;
          updateJoystickFromEvent(event);
        });

        function releaseJoystick(event) {
          if (event.pointerId !== joystickPointerId) return;
          joystickPointerId = null;
          resetJoystick();
        }

        zone.addEventListener('pointerup', releaseJoystick);
        zone.addEventListener('pointercancel', releaseJoystick);
        zone.addEventListener('pointerleave', releaseJoystick);

        lookZone.addEventListener('pointerdown', (event) => {
          if (scene.is('vr-mode')) return;
          lookPointerId = event.pointerId;
          lookZone.setPointerCapture(event.pointerId);
          lookActive = true;
          lastLookX = event.clientX;
          lastLookY = event.clientY;
        });

        lookZone.addEventListener('pointermove', (event) => {
          if (!lookActive || event.pointerId !== lookPointerId || scene.is('vr-mode')) return;
          const dx = event.clientX - lastLookX;
          const dy = event.clientY - lastLookY;
          lastLookX = event.clientX;
          lastLookY = event.clientY;

          const playerObj = player.object3D;
          playerObj.rotation.y -= dx * 0.01;

          pitch = Math.max(-0.9, Math.min(0.7, pitch - dy * 0.01));
          camera.object3D.rotation.x = pitch;
        });

        function releaseLook(event) {
          if (event.pointerId !== lookPointerId) return;
          lookActive = false;
          lookPointerId = null;
        }

        lookZone.addEventListener('pointerup', releaseLook);
        lookZone.addEventListener('pointercancel', releaseLook);

        scene.addEventListener('enter-vr', () => {
          document.getElementById('hud').classList.add('hidden');
        });

        scene.addEventListener('exit-vr', () => {
          document.getElementById('hud').classList.remove('hidden');
          camera.object3D.rotation.x = 0;
          pitch = 0;
          instructions.textContent = 'Drag right side to look · Use joystick to move · Tap the VR button for Quest';
        });
      });
    </script>
  </head>
  <body>
    <div id="hud">
      <div id="instructions">Drag right side to look · Use joystick to move · Tap the VR button for Quest</div>
      <div id="joystick-zone" aria-label="Movement joystick">
        <div id="joystick-knob"></div>
      </div>
      <div id="look-zone" aria-hidden="true"></div>
    </div>

    <a-scene shadow="type: pcfsoft" renderer="colorManagement: true; physicallyCorrectLights: true">
      <a-assets></a-assets>

      <a-entity environment="preset: forest; dressingAmount: 160; dressingScale: 1.3; skyType: atmosphere; lighting: distant; groundColor: #355e3b; groundColor2: #27492d"></a-entity>

      <a-light type="hemisphere" intensity="0.65" color="#ffffff" groundColor="#6b8b5a"></a-light>
      <a-light type="directional" intensity="0.9" position="-3 8 2" cast-shadow="true"></a-light>

      <a-plane rotation="-90 0 0" width="160" height="160" color="#365b37" material="shader: flat; opacity: 0" shadow="receive: true"></a-plane>

      <a-entity position="0 0 -8">
        <a-cylinder position="0 1.6 0" radius="0.28" height="3.2" color="#6d4c41" shadow="cast: true"></a-cylinder>
        <a-sphere position="0 3.7 0" radius="1.55" color="#2e7d32" shadow="cast: true; receive: true"></a-sphere>
        <a-sphere position="-0.8 3.1 0.45" radius="1.05" color="#388e3c" shadow="cast: true; receive: true"></a-sphere>
        <a-sphere position="0.75 3.15 -0.3" radius="1.1" color="#43a047" shadow="cast: true; receive: true"></a-sphere>
        <a-sphere position="0 4.35 0" radius="1.15" color="#2e7d32" shadow="cast: true; receive: true"></a-sphere>
      </a-entity>

      <a-entity position="6 0 -10">
        <a-cylinder position="0 1.5 0" radius="0.25" height="3" color="#5d4037" shadow="cast: true"></a-cylinder>
        <a-sphere position="0 3.45 0" radius="1.25" color="#1b5e20" shadow="cast: true"></a-sphere>
        <a-sphere position="0 4.2 0" radius="0.95" color="#2e7d32" shadow="cast: true"></a-sphere>
      </a-entity>

      <a-entity id="player" position="0 0 5" player-controller>
        <a-entity id="character-visual" position="0 0 0">
          <a-cylinder position="0 0.55 0" radius="0.28" height="1.1" color="#3f51b5" shadow="cast: true"></a-cylinder>
          <a-sphere position="0 1.38 0" radius="0.24" color="#ffcc80" shadow="cast: true"></a-sphere>
          <a-cylinder position="-0.18 0.18 0" radius="0.08" height="0.36" color="#263238"></a-cylinder>
          <a-cylinder position="0.18 0.18 0" radius="0.08" height="0.36" color="#263238"></a-cylinder>
        </a-entity>

        <a-entity id="camera-mount" position="0 1.45 3.8">
          <a-camera id="player-camera" position="0 0 0" look-controls="pointerLockEnabled: false; touchEnabled: false; mouseEnabled: true; magicWindowTrackingEnabled: false" wasd-controls-enabled="false">
            <a-cursor color="white" fuse="false"></a-cursor>
          </a-camera>
        </a-entity>

        <a-entity oculus-touch-controls="hand: left" laser-controls="hand: left"></a-entity>
        <a-entity oculus-touch-controls="hand: right" laser-controls="hand: right"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
